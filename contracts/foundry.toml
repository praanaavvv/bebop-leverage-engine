[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"   # Base supports EIP-1153 transient storage
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "write", path = "./addresses.json" },
]

[rpc_endpoints]
base = "${BASE_RPC}"
